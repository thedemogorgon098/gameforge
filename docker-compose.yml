services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: gameforge
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-gameforge}
      POSTGRES_DB: gameforge
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./backend/db/schema.sql:/docker-entrypoint-initdb.d/001_schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gameforge"]
      interval: 3s
      retries: 20

  api:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+asyncpg://gameforge:${POSTGRES_PASSWORD:-gameforge}@db:5432/gameforge
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      AI_PROVIDER: ${AI_PROVIDER:-claude}
      PUBLIC_APP_URL: ${PUBLIC_APP_URL:-http://localhost:3000}
      TRUST_FORWARDED_FOR: "true" # only the web container can reach the API
    depends_on:
      db:
        condition: service_healthy
    expose: ["8000"]

  web:
    build: ./frontend
    environment:
      API_URL: http://api:8000
    depends_on: [api]
    ports: ["3000:3000"]

volumes:
  pgdata:
